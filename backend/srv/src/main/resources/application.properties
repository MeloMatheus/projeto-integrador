spring.application.name=cupcake-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cupcake}
spring.datasource.username=${DB_USERNAME:cupcake}
spring.datasource.password=${DB_PASSWORD:cupcake}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION:3600}
app.bootstrap.admin.email=${INITIAL_ADMIN_EMAIL:}
app.bootstrap.admin.password=${INITIAL_ADMIN_PASSWORD:}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
server.error.include-message=never
