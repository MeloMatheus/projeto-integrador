services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cupcake
      POSTGRES_USER: ${DB_USERNAME:-cupcake}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cupcake}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-cupcake} -d cupcake"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - cupcake-data:/var/lib/postgresql/data
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://ep-old-dawn-b5r5mcsn-pooler.c-7.us-east-2.aws.neon.tech/loja_cupcakes
      DB_USERNAME: neondb_owner
      DB_PASSWORD: npg_OcFSpK6EfQt5
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no arquivo .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    ports:
      - "8081:8081"
volumes:
  cupcake-data:
