services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cupcake
      POSTGRES_USER: ${DB_USERNAME:-cupcake}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cupcake}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-cupcake} -d cupcake"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - cupcake-data:/var/lib/postgresql/data
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/cupcake
      DB_USERNAME: ${DB_USERNAME:-cupcake}
      DB_PASSWORD: ${DB_PASSWORD:-cupcake}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no arquivo .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
volumes:
  cupcake-data:
